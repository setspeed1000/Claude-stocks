name: TSX screener

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only screen the first N symbols (blank = all)"
        required: false
  push:
    branches: [claude/project-thread-lxrqgw]   # temporary: test run on the PR branch
    paths: ["screener/**", ".github/workflows/screener.yml"]

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: screener/requirements.txt
      - run: pip install -r screener/requirements.txt
      - name: Offline test
        run: python screener/test_screen.py
      - name: Screen the TSX
        run: python screener/screen.py ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      - name: Job summary
        run: cat data/screener/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "screener-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/screener
          git diff --cached --quiet && exit 0
          git commit -m "Screener results $(date -u +%F)"
          git push
