function drawScatter(host, pts, held) {
  if (!host.isConnected || !host.clientWidth) return;
  host.replaceChildren();
  const W = host.clientWidth, H = W < 520 ? 300 : 340;
  const m = { t: 16, r: 24, b: 36, l: 48 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const ext = Math.max(0.05, ...pts.map(p => Math.abs(p.m.vs90))) * 1.15;
  const ticks = niceTicks(-ext, ext, 4);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const x = v => m.l + (v - lo) / (hi - lo) * iw;
  const y = v => m.t + (1 - v) * ih;
  const root = svg("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": "Scatter plot of watchlist stocks by momentum. The table below lists every value." });
  // quadrant wash
  root.append(svg("rect", { x: x(0), y: y(1), width: x(hi) - x(0), height: y(0.5) - y(1), fill: css("--gain"), "fill-opacity": 0.05 }));
  root.append(svg("rect", { x: x(lo), y: y(0.5), width: x(0) - x(lo), height: y(0) - y(0.5), fill: css("--loss"), "fill-opacity": 0.05 }));
  for (const tv of ticks) {
    root.append(svg("line", { x1: x(tv), x2: x(tv), y1: m.t, y2: m.t + ih, stroke: Math.abs(tv) < 1e-9 ? css("--axis") : css("--grid"), "stroke-width": 1, "shape-rendering": "crispEdges" }));
    const t = svg("text", { x: x(tv), y: H - 18, "text-anchor": "middle", "font-size": 12, fill: css("--slate") });
    t.textContent = pctTicks(tv);
    root.append(t);
  }
  for (const v of [0, 0.5, 1]) {
    root.append(svg("line", { x1: m.l, x2: m.l + iw, y1: y(v), y2: y(v), stroke: v === 0.5 ? css("--axis") : css("--grid"), "stroke-width": 1, "shape-rendering": "crispEdges" }));
    const t = svg("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end", "font-size": 12, fill: css("--slate") });
    t.textContent = v === 0 ? "Low" : v === 1 ? "High" : "Mid";
    root.append(t);
  }
  const xl = svg("text", { x: m.l + iw, y: H - 2, "text-anchor": "end", "font-size": 11, fill: css("--slate") });
  xl.textContent = "vs 90-day average";
  root.append(xl);
  const ql = svg("text", { x: m.l + iw - 6, y: m.t + 14, "text-anchor": "end", "font-size": 11, fill: css("--gain") });
  ql.textContent = "Strong";
  const ql2 = svg("text", { x: m.l + 6, y: m.t + ih - 6, "font-size": 11, fill: css("--loss") });
  ql2.textContent = "Weak";
  root.append(ql, ql2);

  const tip = el("div", { class: "tip", "aria-hidden": "true" });
  const placed = [];
  for (const p of pts) {
    const cx = x(p.m.vs90), cy = y(p.m.inRange);
    const isBench = p.w.Note === "Benchmark";
    const color = held.has(p.w.Ticker) ? css("--s-bench") : css("--s-claude");
    const g = svg("g", { tabindex: "0", role: "img", "aria-label": `${p.w.Ticker}: ${fmtPct(p.m.vs90)} vs its 90-day average, ${Math.round(p.m.inRange * 100)}% up its 30-day range` });
    g.append(svg("circle", { cx, cy, r: 12, fill: "transparent" }));
    g.append(isBench
      ? svg("circle", { cx, cy, r: 5, fill: css("--paper"), stroke: css("--slate"), "stroke-width": 2 })
      : svg("circle", { cx, cy, r: 5, fill: color, stroke: css("--paper"), "stroke-width": 2 }));
    // label: right of the dot unless near the right edge; nudge if another label sits there
    let lx = cx + 9, anchor = "start";
    if (cx > m.l + iw - 50) { lx = cx - 9; anchor = "end"; }
    let ly = cy + 4;
    while (placed.some(q => Math.abs(q.y - ly) < 13 && Math.abs(q.x - lx) < 44)) ly += 13;
    placed.push({ x: lx, y: ly });
    const lab = svg("text", { x: lx, y: ly, "text-anchor": anchor, "font-size": 12, "font-weight": 700, fill: css("--ink") });
    lab.textContent = p.w.Ticker;
    g.append(lab);
    const show = () => {
      tip.replaceChildren(el("span", { class: "tip-date" }, p.w.Name || p.w.Ticker),
        el("div", { class: "tip-row" }, el("b", {}, fmtMoney(p.m.px)), el("span", {}, "price")),
        el("div", { class: "tip-row" }, el("b", {}, fmtPct(p.m.vs90)), el("span", {}, "vs 90-day average")),
        el("div", { class: "tip-row" }, el("b", {}, `${Math.round(p.m.inRange * 100)}%`), el("span", {}, "up the 30-day range")));
      tip.classList.add("is-on");
      const scale = host.clientWidth / W;
      let left = cx * scale + 14;
      if (left + tip.offsetWidth > host.clientWidth) left = cx * scale - tip.offsetWidth - 14;
      tip.style.left = `${Math.max(0, left)}px`;
      tip.style.top = `${Math.max(0, cy * scale - 20)}px`;
    };
    const hide = () => tip.classList.remove("is-on");
    g.addEventListener("pointerenter", show); g.addEventListener("pointerleave", hide);
    g.addEventListener("focus", show); g.addEventListener("blur", hide);
    root.append(g);
  }
  host.append(root, tip);
}

  const rows = watch.filter(w => w.Ticker).map(w => [w, watchSignals(w)]).filter(([, s]) => s.length);
  const sec = section("sig-title", "Signals", "Plain-language flags from the Watchlist numbers. They're prompts to look closer, not buy or sell calls.");

  return sec;
}

function renderJournal(data) {
  const entries = [];
  for (const t of data.trades.filter(t => t.Ticker && asDate(t.Date))) {
    const sh = num(t.Shares);
    const px = t.Status === "Filled" ? num(t["Fill price"]) : num(t["Limit price"]);
    entries.push({ date: asDate(t.Date), kind: "trade", title: `${t.Action} ${isNum(sh) ? sh + " " : ""}${t.Ticker}${isNum(px) ? ` at ${fmtMoney(px)}` : ""}`, tag: t.Status, body: t.Reason });
  }
  for (const r of data.dailyLog || []) {
    const d = asDate(r.Date);
    if (!d) continue;
    const cash = num(r["Cash per Wealthsimple (CAD)"]);
    const val = num(r["Account value (CAD)"]);
    if (!r.Notes && !isNum(cash)) continue;
    entries.push({ date: d, kind: "note", title: "Daily check", tag: null,
      body: [r.Notes, [isNum(val) ? `Account ${fmtMoney(val)}` : null, isNum(cash) ? `cash per Wealthsimple ${fmtMoney(cash)}` : null].filter(Boolean).join(", ")].filter(Boolean).join(" ") });
  }
  for (const c of data.contributions) {
    const d = asDate(c.Date), amt = num(c["Deposit into Claude's account (CAD)"]);
    if (d && isNum(amt)) entries.push({ date: d, kind: "deposit", title: `Deposit of ${fmtMoney(amt)}`, tag: null, body: "Matched by the same amount of XEQT on the benchmark side." });
  }
  // Open steps live on the Overview; the Journal keeps the ones that are finished.
  for (const t of data.todo.filter(t => asDate(t.Date) && t.Action && todoStatus(t) !== "Open")) {
    entries.push({ date: asDate(t.Date), kind: "todo", title: `To do: ${stepTitle(t)}`, tag: todoStatus(t), body: t.Why });
  }
  const sec = section("jr-title", "Journal", "Everything that happened, newest first: trades with Claude's reasoning, finished or replaced to-do steps, deposits and daily notes.");
  if (!entries.length) { sec.append(el("p", { class: "empty" }, "Nothing logged yet.")); return sec; }
  entries.sort((a, b) => b.date - a.date || a.kind.localeCompare(b.kind));
  const days = new Map();
  for (const e of entries) { const k = dayKey(e.date); if (!days.has(k)) days.set(k, []); days.get(k).push(e); }
  const tl = el("ol", { class: "timeline" });
  for (const list of days.values()) {
    tl.append(el("li", { class: "tl-day" },
      el("h3", {}, new Intl.DateTimeFormat("en-CA", { weekday: "long", month: "long", day: "numeric", year: "numeric" }).format(list[0].date)),
      el("ul", {}, list.map(e => el("li", { class: `tl-item tl-${e.kind}` },
        el("div", { class: "tl-head" }, el("b", {}, e.title), e.tag ? el("span", { class: `status ${e.tag === "Filled" || e.tag === "Done" ? "is-filled" : e.tag === "Planned" ? "is-planned" : ""}` }, e.tag) : null),
        e.body ? el("p", {}, e.body) : null)))));
  }
  sec.append(tl);
  return sec;
}

    entry: plan ? plan.entry : "",
    stop: plan ? plan.stop : "",
    target: plan ? plan.target : "",
  };
  const s = ui.sizer;
  const out = el("div", { class: "sizer-out", "aria-live": "polite" });
  const field = (key, label, step, hint) => {
    const i = el("input", { type: "number", id: `sz-${key}`, inputmode: "decimal", step, min: "0", value: s[key] === "" ? "" : String(s[key]) });
    i.addEventListener("input", () => { s[key] = i.value === "" ? "" : +i.value; calc(); });
    return el("label", { class: "field", for: `sz-${key}` }, el("span", {}, label), i, hint ? el("small", {}, hint) : null);
  };
  const pick = el("select", { id: "sz-pick", class: "select" },
    el("option", { value: "" }, "Fill in a watchlist price"),
    data.watchlist.filter(w => w.Ticker && isNum(num(w["Price (CAD)"]))).map(w => el("option", { value: w.Ticker }, `${w.Ticker}, ${fmtMoney(num(w["Price (CAD)"]))}`)));
  pick.addEventListener("change", () => {
    const w = data.watchlist.find(x => x.Ticker === pick.value);
    if (!w) return;
    s.entry = num(w["Price (CAD)"]);
    document.getElementById("sz-entry").value = s.entry;
    calc();
  });

  function calc() {
    const { account, cash, risk, entry, stop, target } = s;
    if (!(entry > 0) || !(stop > 0) || stop >= entry) {
      out.replaceChildren(el("p", { class: "empty" }, "Enter a buy price and a stop-loss below it."));
      return;
    }
    const riskBudget = account * risk / 100;
    const perShare = entry - stop;
    const byRisk = Math.floor(riskBudget / perShare + 1e-9);
    const byCash = Math.floor(cash / entry + 1e-9);
    const shares = Math.max(0, Math.min(byRisk, byCash));
    const cost = shares * entry;
    const maxLoss = shares * perShare;
    const reward = target > entry ? shares * (target - entry) : null;
    const rr = target > entry ? (target - entry) / perShare : null;
    const stopRule = (num(f.total_in) || num(f.start_cash) || 20) * (num(f.stop_level) || 0.7);
    const limiter = byCash < byRisk ? "cash on hand" : "your risk limit";
    out.replaceChildren(...[
      el("p", { class: "sizer-head" }, shares > 0
        ? el("span", {}, "Buy ", el("b", {}, `${shares} share${shares === 1 ? "" : "s"}`), ` for ${fmtMoney(cost)}.`)
        : el("span", {}, el("b", {}, "Too expensive for this setup."), ` One share risks ${fmtMoney(perShare)}, more than the ${fmtMoney(riskBudget)} limit, or costs more than the cash.`)),
      statGrid([
        ["Most you'd lose", fmtMoney(maxLoss), `${account > 0 ? ((maxLoss / account) * 100).toFixed(1) : "–"}% of the account, if the stop fills`],
        ["Gain at target", isNum(reward) ? fmtMoney(reward) : "–", isNum(rr) ? `${rr.toFixed(1)} to 1 reward to risk` : "Add a target"],
        ["Share of the account", account > 0 ? `${Math.round(cost / account * 100)}%` : "–", `Limited by ${limiter}`],
        ["After a stop-out", fmtMoney(account - maxLoss), account - maxLoss <= stopRule ? "This would trigger the 30% stop rule" : `${fmtMoney(account - maxLoss - stopRule)} above the stop rule`],
      ]),
      isNum(rr) && rr < 1.5 ? el("p", { class: "warn-line" }, "Reward is less than 1.5 times the risk. Many traders skip setups like this.") : null].filter(Boolean));
  }

  const sec = section("sz-title", "Position size calculator", "How many shares to buy so a stop-loss costs no more than a set share of the account. Starts with the latest trade plan.");
  sec.append(el("div", { class: "sizer" },
    el("div", { class: "fields" },
      field("account", "Account value", "0.01"),
      field("cash", "Cash available", "0.01"),
      field("risk", "Risk per trade, %", "0.5", "Claude's plans have used about 4%"),
      el("label", { class: "field", for: "sz-pick" }, el("span", {}, "Stock"), pick),
      field("entry", "Buy price", "0.01"),
      field("stop", "Stop-loss", "0.01"),
      field("target", "Target (optional)", "0.01")),
    out));
  calc();
  return sec;
}

function renderProjection(data) {
  const f = data.feed;
  const p = ui.proj;
  const sec = section("pj-title", "Where the deposits could go",
    "A what-if, not a forecast: $20 a month added to today's values, growing at the yearly returns you pick. Change the numbers to compare.");
  const host = el("div", { class: "chart-host" });
  const summary = el("p", { class: "proj-sum", "aria-live": "polite" });
  const input = (key, label, min, max, step, suffix) => {
    const i = el("input", { type: "range", id: `pj-${key}`, min, max, step, value: String(p[key]) });
    const v = el("output", { for: `pj-${key}` }, `${p[key]}${suffix}`);
    i.addEventListener("input", () => { p[key] = +i.value; v.textContent = `${p[key]}${suffix}`; draw(); });
    return el("label", { class: "field range-field", for: `pj-${key}` }, el("span", {}, label, " ", v), i);
  };
  sec.append(el("div", { class: "fields fields-3" },
    input("months", "Months ahead", 3, 60, 1, ""),
    input("claude", "Claude's yearly return", -30, 40, 1, "%"),
    input("xeqt", "XEQT's yearly return", -30, 40, 1, "%")),
    el("div", { class: "chart-legend", "aria-hidden": "true", style: "margin-top:1rem" },
      el("span", {}, el("i", { class: "key-line", style: "background:var(--s-claude)" }), "Claude's picks"),
      el("span", {}, el("i", { class: "key-line", style: "background:var(--s-bench)" }), "XEQT"),
      el("span", {}, el("i", { class: "key-line", style: "background:var(--s-in)" }), "Money put in")),
    host, summary);

  function series() {
    let c = num(f.account_value) || num(f.start_cash) || 20;
    let b = num(f.benchmark_value) || c;
    let put = num(f.total_in) || num(f.start_cash) || 20;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const pts = [{ date: today, c, b, put }];
    const mc = Math.pow(1 + p.claude / 100, 1 / 12) - 1, mb = Math.pow(1 + p.xeqt / 100, 1 / 12) - 1;
    for (let i = 1; i <= p.months; i++) {
      c = c * (1 + mc) + 20; b = b * (1 + mb) + 20; put += 20;
      pts.push({ date: new Date(today.getFullYear(), today.getMonth() + i, today.getDate()), c, b, put });
    }
    return pts;
  }
  function draw() {
    const pts = series();
    const last = pts[pts.length - 1];
    drawLineChart(host, pts, {
      series: [{ key: "put", color: css("--s-in"), name: "Put in" }, { key: "b", color: css("--s-bench"), name: "XEQT" }, { key: "c", color: css("--s-claude"), name: "Claude" }],
      fmt: fmtMoney, signed: false, floorZero: true, minPad: 1,
      xFmt: d => new Intl.DateTimeFormat("en-CA", { month: "short", year: "2-digit" }).format(d),
      tipDate: d => new Intl.DateTimeFormat("en-CA", { month: "long", year: "numeric" }).format(d),
      aria: `Projection over ${p.months} months. Claude reaches ${fmtMoney(last.c)}, XEQT ${fmtMoney(last.b)}, with ${fmtMoney(last.put)} put in.`,
    });
    const gap = last.c - last.b;
    summary.replaceChildren(`In ${p.months} months: `, el("b", {}, fmtMoney(last.put)), " put in, Claude at ", el("b", {}, fmtMoney(last.c)),
      ", XEQT at ", el("b", {}, fmtMoney(last.b)), `. ${Math.abs(gap) < 0.005 ? "Even." : `Claude ${gap > 0 ? "ahead" : "behind"} by ${fmtMoney(Math.abs(gap))}.`}`);
  }
  drawers.push(draw);
  return sec;
}

function renderStopCheck(data) {
  const f = data.feed;
  const putIn = num(f.total_in) || num(f.start_cash) || 20;
  const level = num(f.stop_level) || 0.7;
  const acct = num(f.account_value);
  const line = putIn * level;
  return section("sr-title", "The stop rule", null,
    el("p", { class: "section-note" }, `If the account falls to ${fmtMoney(line)} (${Math.round((1 - level) * 100)}% below the ${fmtMoney(putIn)} put in), the experiment ends and the money moves into XEQT. ${isNum(acct) ? `Right now the account can lose ${fmtMoney(Math.max(0, acct - line))}, or ${((Math.max(0, acct - line) / acct) * 100).toFixed(0)}% of its value, before that happens.` : ""} Each new deposit raises the line by ${fmtMoney(20 * level)}.`));
}

/* ================================================================
   Views
================================================================ */

function viewContent(view, data) {
  const f = data.feed;
  switch (view) {
    case "trades": return [renderTradeStats(data.trades), renderPlans(data), renderResults(data.trades), renderByTicker(data.trades), renderTradeLog(data.trades)];
    case "performance": {
      const ps = perfSeries(equitySeries(data));
      return [
        renderEquity(data),
        renderPerfCompare(ps),
        renderPerfChart(ps, "ret-title", "Return over time", "Time-weighted return since the start, so deposits don't show up as gains.", ["tc", "tb"], { area: "tc" }),
        renderPerfChart(ps, "dd-title", "Drops from the high", "How far each side sits below its best point so far. Zero means at a new high.", ["dc", "db"], { ceilZero: true }),
        renderMonthly(ps, data),
        renderDeposits(data),
      ];
    }
    case "watchlist": return [
      (() => { const w = renderWatchlist(sortedWatch(data.watchlist), data.holdings); w.insertBefore(renderWatchControls(), w.querySelector(".watch")); return w; })(),
      renderMomentumMap(data),
      renderSignals(data.watchlist),
    ];
    case "journal": return [renderJournal(data)];
    case "tools": return [renderSizer(data), renderProjection(data), renderStopCheck(data)];
    default: return [
      renderRace(f),
      renderStats(data),
      renderEquity(data),
      el("div", { class: "split" }, renderTodo(data.todo), renderPositions(data.holdings, f)),
      renderPlans(data),
    ];
  }
}

let lastData = null;
function renderView() {
  if (!lastData) return;
  const focusId = document.activeElement && document.activeElement.id;
  const selStart = document.activeElement && "selectionStart" in document.activeElement ? document.activeElement.selectionStart : null;
  renderTabs();
  const app = document.getElementById("app");
  drawers.length = 0;
  app.replaceChildren(...viewContent(route.view, lastData));
  app.dataset.view = route.view;
  drawers.forEach(fn => fn());
  if (focusId) {
    const n = document.getElementById(focusId);
    if (n) { n.focus(); if (selStart !== null && n.setSelectionRange && n.type === "search") n.setSelectionRange(selStart, selStart); }
  }
}

let firstRender = true;
function render(data) {
  const f = data.feed;
  lane.animate = firstRender;
  firstRender = false;
  lastData = data;
  renderHeader(f);
  renderAlerts(f);
  renderView();
  const xt = serialToDate(f.xeqt_time);
  document.getElementById("source").textContent =
    `${route.demo ? "Showing sample numbers, not the real account. " : ""}Loaded from the Google Sheet at ${timeFmt.format(new Date())}${xt ? `, with prices as of ${shortDate.format(xt)}, ${timeFmt.format(xt)}` : ""}. Prices come from Google Finance and can be up to 20 minutes behind.`.replace("..", ".");
}

function renderError(err) {
  const box = document.getElementById("alerts");
  const notShared = err.message === "not-shared" || err instanceof TypeError;
  box.replaceChildren(el("div", { class: "alert", role: "alert" },
    el("strong", {}, notShared ? "This page can't read the Google Sheet." : "The numbers didn't load."),
    notShared
      ? "In Google Sheets, open Share, set General access to “Anyone with the link” as Viewer, then reload this page."
      : err.message));
  const app = document.getElementById("app");
  if (app.querySelector(".loading")) app.replaceChildren();
}

function demoHistory() {
  // A made-up month of closes so the over-time chart has something to draw.
  const out = [];
  let a = 20, b = 20;
  const start = new Date(2026, 10, 25);
  for (let i = 1; i <= 35; i++) {
    const day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    if (day.getDay() === 0 || day.getDay() === 6) continue;
    a *= 1 + Math.sin(i * 1.7) * 0.012 + 0.0009;
    b *= 1 + Math.cos(i * 0.9) * 0.006 + 0.0006;
    if (day.getMonth() === 11 && day.getDate() === 24) { a += 20; b += 20; } // Dec 24 deposit
    const notes = { 1: "First full day. AQN order filled at the open.", 14: "T hit its take-profit.", 20: "BTO stopped out on a gold sell-off.", 29: "Monthly $20 deposit landed." };

  }
  return out;
}

/* ---------------- Boot ---------------- */

const reloadBtn = document.getElementById("reload");
async function refresh() {
  reloadBtn.disabled = true;
  reloadBtn.textContent = "Reloading";
  try {
    const data = route.demo ? demoData() : await loadAll();
    render(data);
  } catch (err) {
    console.error(err);
    renderError(err);
  } finally {
    reloadBtn.disabled = false;
    reloadBtn.textContent = "Reload numbers";
  }
}
reloadBtn.addEventListener("click", refresh);
window.addEventListener("hashchange", () => {
  const was = route.demo;
  route = parseRoute();
  if (route.demo !== was) { lastData = null; refresh(); }
  else { renderView(); window.scrollTo({ top: 0 }); }
});
renderTabs();
renderMarket();
setInterval(renderMarket, 60 * 1000);
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MINUTES * 60 * 1000);
</script>
