<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude's $20 vs XEQT</title>
<meta name="description" content="A $20 trading experiment: Claude's picks against the XEQT index ETF, read live from Google Sheets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDF0F3;
    --sheet: #F8FAFB;
    --ink: #13233A;
    --slate: #5E6B7C;
    --rule: #C8D0DA;
    --gain: #0F7B5F;
    --loss: #C2412D;
    --ticket: #F2D27A;
    --ticket-ink: #3B2E05;
    --focus: #1D5FD1;
    --measure: 72ch;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-variation-settings: "wdth" 100;
    font-size: 1rem;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }

  a { color: inherit; text-underline-offset: 0.18em; }

  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
    border-radius: 2px;
  }

  .wrap {
    max-width: 68rem;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
  }

  /* Header */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 2px solid var(--ink);
  }
  .masthead h1 {
    margin: 0;
    font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.125rem);
    font-weight: 800;
    font-variation-settings: "wdth" 112;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .masthead p { margin: 0; color: var(--slate); }

  /* Alerts */
  .alert {
    margin: 1.25rem 0 0;
    padding: 0.875rem 1rem;
    border-left: 4px solid var(--loss);
    background: #FBE9E5;
    max-width: var(--measure);
  }
  .alert strong { display: block; }
  .alert.is-info { border-left-color: var(--focus); background: #E6EEFB; }

  /* Hero: the race */
  .race { margin: 2.25rem 0 2.75rem; }

  .verdict {
    margin: 0 0 1.75rem;
    font-size: clamp(1.75rem, 1rem + 3.6vw, 3.5rem);
    font-weight: 800;
    font-variation-settings: "wdth" 118;
    line-height: 1.05;
    letter-spacing: -0.02em;
    max-width: 18ch;
  }
  .verdict.is-behind { color: var(--loss); }
  .verdict.is-ahead { color: var(--gain); }

  .lanes { display: grid; gap: 1.25rem; }

  .lane {
    display: grid;
    grid-template-columns: 11rem 1fr 9.5rem;
    align-items: center;
    gap: 1rem;
  }
  .lane-name { font-weight: 600; line-height: 1.25; }
  .lane-name small { display: block; font-weight: 400; color: var(--slate); }

  .track {
    position: relative;
    height: 2.75rem;
    background:
      repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--rule) calc(10% - 1px) 10%);
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .track::after {
    /* the starting line: $20 */
    content: "";
    position: absolute;
    left: 50%;
    top: -0.5rem;
    bottom: -0.5rem;
    width: 2px;
    background: var(--ink);
  }
  .bar {
    position: absolute;
    top: 0.375rem;
    bottom: 0.375rem;
    background: var(--gain);
    transform-origin: left center;
  }
  .bar.is-loss { background: var(--loss); transform-origin: right center; }
  .bar.is-bench { background: var(--slate); }
  .bar.is-bench.is-loss { background: #8E99A8; }
  .bar.is-pending { background: transparent; border: 1px dashed var(--slate); }

  .lane-value { text-align: right; line-height: 1.2; }
  .lane-value b {
    display: block;
    font-size: 1.5rem;
    font-weight: 800;
    font-variation-settings: "wdth" 110;
  }
  .lane-value span { color: var(--slate); }

  .scale {
    display: grid;
    grid-template-columns: 11rem 1fr 9.5rem;
    gap: 1rem;
    margin-top: 0.5rem;
    color: var(--slate);
    font-size: 0.8125rem;
  }
  .scale-axis { display: flex; justify-content: space-between; }

  @media (prefers-reduced-motion: no-preference) {
    .bar.is-grow { animation: grow 900ms cubic-bezier(.2,.7,.2,1) both; }
    .lane:nth-child(2) .bar.is-grow { animation-delay: 150ms; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  }

  /* Sections */
  section { margin-top: 3rem; }
  h2 {
    margin: 0 0 1rem;
    font-size: 1.375rem;
    font-weight: 700;
    font-variation-settings: "wdth" 108;
    line-height: 1.2;
  }
  .section-note { margin: -0.5rem 0 1rem; color: var(--slate); max-width: var(--measure); }
  .empty { margin: 0; color: var(--slate); max-width: var(--measure); }

  .split {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 2.5rem;
  }
  .split > section { margin-top: 0; }

  /* Order tickets */
  .tickets { display: grid; gap: 1rem; }
  .ticket {
    background: var(--ticket);
    color: var(--ticket-ink);
    padding: 1.125rem 1.25rem 1.25rem;
    border-radius: 3px;
    border-left: 6px solid var(--ticket-ink);
  }
  .ticket h3 {
    margin: 0 0 0.75rem;
    font-size: 1.375rem;
    font-weight: 800;
    font-variation-settings: "wdth" 106;
    line-height: 1.2;
  }
  .ticket dl {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.5rem 1rem;
    margin: 0 0 0.75rem;
  }
  .ticket dt { font-size: 0.8125rem; }
  .ticket dd { margin: 0; font-weight: 700; font-size: 1.0625rem; }
  .ticket p { margin: 0; max-width: var(--measure); }
  .ticket .ticket-date { font-size: 0.875rem; margin-bottom: 0.25rem; }

  /* Positions */
  .positions { display: grid; gap: 0; border-top: 1px solid var(--rule); }
  .position {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.125rem 1rem;
    padding: 0.875rem 0;
    border-bottom: 1px solid var(--rule);
  }
  .position b { font-size: 1.125rem; }
  .position .pos-value { text-align: right; font-weight: 700; font-size: 1.125rem; }
  .position .pos-meta { color: var(--slate); font-size: 0.9375rem; }
  .position .pos-change { text-align: right; font-size: 0.9375rem; }

  .cash-line {
    display: flex;
    justify-content: space-between;
    padding: 0.875rem 0;
    border-bottom: 1px solid var(--rule);
    color: var(--slate);
  }
  .cash-line b { color: var(--ink); }

  .up { color: var(--gain); }
  .down { color: var(--loss); }

  /* Watchlist */
  .watch { border-top: 2px solid var(--ink); }
  .watch-head, .watch-row {
    display: grid;
    grid-template-columns: 4.5rem minmax(9rem, 1.3fr) 5.5rem 5rem minmax(12rem, 2fr) 6.5rem;
    gap: 1rem;
    align-items: center;
  }
  .watch-head {
    padding: 0.5rem 0;
    font-size: 0.8125rem;
    color: var(--slate);
    border-bottom: 1px solid var(--rule);
  }
  .watch-row { padding: 0.625rem 0; border-bottom: 1px solid var(--rule); }
  .watch-row .tk { font-weight: 800; font-variation-settings: "wdth" 110; }
  .watch-row .nm { color: var(--slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .num { text-align: right; }
  .watch-row.is-held { background: linear-gradient(90deg, rgba(242,210,122,.45), transparent 60%); }

  .range {
    position: relative;
    height: 1.5rem;
  }
  .range-line {
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 2px;
    background: var(--rule);
    transform: translateY(-50%);
  }
  .range-avg {
    position: absolute;
    top: 0.25rem; bottom: 0.25rem;
    width: 2px;
    background: var(--slate);
  }
  .range-dot {
    position: absolute;
    top: 50%;
    width: 0.75rem; height: 0.75rem;
    border-radius: 50%;
    background: var(--ink);
    transform: translate(-50%, -50%);
  }
  .range-labels {
    display: flex; justify-content: space-between;
    font-size: 0.75rem; color: var(--slate);
    margin-top: -0.125rem;
  }
  .trend { font-size: 0.875rem; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem;
    margin-top: 0.75rem;
    font-size: 0.8125rem; color: var(--slate);
  }
  .legend span::before {
    content: ""; display: inline-block; vertical-align: middle; margin-right: 0.4rem;
  }
  .legend .lg-dot::before { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--ink); }
  .legend .lg-avg::before { width: 2px; height: 0.9rem; background: var(--slate); }
  .legend .lg-held::before { width: 1rem; height: 0.6rem; background: var(--ticket); }

  /* Trade log */
  .log { border-top: 2px solid var(--ink); }
  .trade { border-bottom: 1px solid var(--rule); }
  .trade summary {
    display: grid;
    grid-template-columns: 8rem 1fr 6.5rem 7rem 1.25rem;
    gap: 1rem;
    align-items: baseline;
    padding: 0.75rem 0;
    cursor: pointer;
    list-style: none;
  }
  .trade summary::-webkit-details-marker { display: none; }
  .trade summary::after {
    content: "+";
    text-align: right;
    color: var(--slate);
    font-weight: 700;
  }
  .trade[open] summary::after { content: "\2212"; }
  .trade .tr-what b { font-variation-settings: "wdth" 108; }
  .trade .tr-date { color: var(--slate); }
  .status {
    font-size: 0.875rem;
    padding: 0.0625rem 0.5rem;
    border-radius: 999px;
    border: 1px solid var(--rule);
    justify-self: start;
    white-space: nowrap;
  }
  .status.is-filled { border-color: var(--ink); background: var(--ink); color: var(--sheet); }
  .status.is-planned { border-color: var(--ticket-ink); background: var(--ticket); color: var(--ticket-ink); }
  .trade .tr-body {
    padding: 0 0 1rem 9rem;
    color: var(--slate);
    max-width: calc(var(--measure) + 9rem);
  }
  .trade .tr-body p { margin: 0 0 0.375rem; }

  /* Contributions */
  .contrib {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 12rem));
    gap: 1rem;
    border-top: 2px solid var(--ink);
    padding-top: 1rem;
  }
  .contrib div span { display: block; color: var(--slate); font-size: 0.875rem; }
  .contrib div b { font-size: 1.375rem; font-weight: 800; font-variation-settings: "wdth" 110; }

  /* Footer */
  footer {
    margin-top: 4rem;
    padding-top: 1rem;
    border-top: 1px solid var(--rule);
    color: var(--slate);
    font-size: 0.875rem;
    display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem;
    align-items: center; justify-content: space-between;
  }
  footer p { margin: 0; max-width: var(--measure); }
  button {
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    background: var(--sheet);
    border: 1px solid var(--ink);
    border-radius: 3px;
    padding: 0.5rem 1rem;
    cursor: pointer;
  }
  button:hover { background: #fff; }
  button[disabled] { opacity: 0.6; cursor: progress; }

  .loading { color: var(--slate); margin: 3rem 0; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  @media (max-width: 52rem) {
    .split { grid-template-columns: 1fr; gap: 3rem; }
    .watch-head { display: none; }
    .watch-row {
      grid-template-columns: 4rem 1fr auto;
      grid-template-areas:
        "tk nm pr"
        "rg rg ch";
      gap: 0.375rem 0.75rem;
    }
    .watch-row .tk { grid-area: tk; }
    .watch-row .nm { grid-area: nm; }
    .watch-row .pr { grid-area: pr; }
    .watch-row .ch { display: none; }
    .watch-row .rg { grid-area: rg; }
    .watch-row .trend { grid-area: ch; text-align: right; }
  }

  @media (max-width: 40rem) {
    .wrap { padding-top: 1.25rem; }
    .lane, .scale { grid-template-columns: 1fr auto; }
    .lane .track { grid-column: 1 / -1; grid-row: 2; }
    .scale > :first-child, .scale > :last-child { display: none; }
    .scale { grid-template-columns: 1fr; }
    .ticket dl { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .trade summary { grid-template-columns: 1fr auto 1.25rem; }
    .trade .tr-date { grid-column: 1 / -1; font-size: 0.875rem; margin-bottom: -0.5rem; }
    .trade .tr-cash { display: none; }
    .trade .tr-body { padding-left: 0; }
    .contrib { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .contrib div b { font-size: 1.125rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>Claude's $20 vs XEQT</h1>
    <p id="started">Loading the sheet</p>
  </header>

  <div id="alerts" aria-live="polite"></div>

  <main id="app">
    <p class="loading">Loading the latest numbers from Google Sheets.</p>
  </main>

  <footer>
    <p id="source">Reads the experiment's Google Sheet each time the page loads. Prices come from Google Finance and can be up to 20 minutes behind.</p>
    <button type="button" id="reload">Reload numbers</button>
  </footer>
</div>

<script>
/* ---------------------------------------------------------------
   Configuration. The sheet must be shared as
   "Anyone with the link: Viewer" for this page to read it.
---------------------------------------------------------------- */
const SHEET_ID = "19zBoY4-Nysf8MsGjQWiEoFFDCM5YwFFGU167vX3NEZs";
const REFRESH_MINUTES = 5;
const TABS = {
  feed: "Dashboard feed",
  trades: "Trades",
  holdings: "Holdings",
  watchlist: "Watchlist",
  contributions: "Contributions",
};

/* ---------------- Data loading (Google Visualization API) ---------------- */

function sheetUrl(tab) {
  const params = new URLSearchParams({ tqx: "out:json", headers: "1", sheet: tab });
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params}`;
}

function parseGvizDate(v) {
  // "Date(2026,10,25)" or "Date(2026,10,24,16,0,0)"; month is 0-based
  const m = /^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/.exec(v);
  if (!m) return null;
  return new Date(+m[1], +m[2], +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
}

async function loadTab(tab) {
  const res = await fetch(sheetUrl(tab), { cache: "no-store" });
  if (!res.ok) throw new Error(`The sheet returned ${res.status} for the ${tab} tab.`);
  const text = await res.text();
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  if (start < 0 || end < 0) throw new Error("not-shared");
  const json = JSON.parse(text.slice(start, end + 1));
  if (json.status === "error") {
    const msg = (json.errors && json.errors[0] && (json.errors[0].detailed_message || json.errors[0].message)) || "unknown error";
    throw new Error(`The ${tab} tab couldn't be read: ${msg}`);
  }
  const cols = json.table.cols.map((c, i) => (c.label || c.id || `col${i}`).trim());
  return (json.table.rows || []).map(r => {
    const row = {};
    cols.forEach((name, i) => {
      const cell = r.c && r.c[i];
      let v = cell ? cell.v : null;
      if (typeof v === "string" && v.startsWith("Date(")) v = parseGvizDate(v);
      row[name] = v;
    });
    return row;
  });
}

async function loadAll() {
  const entries = await Promise.all(
    Object.entries(TABS).map(async ([key, tab]) => [key, await loadTab(tab)])
  );
  const data = Object.fromEntries(entries);
  const feed = {};
  data.feed.forEach(r => { if (r.Key) feed[r.Key] = r.Value; });
  data.feed = feed;
  return data;
}

/* ---------------- Formatting helpers ---------------- */

const money = new Intl.NumberFormat("en-CA", { style: "currency", currency: "CAD", currencyDisplay: "narrowSymbol", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pctFmt = new Intl.NumberFormat("en-CA", { style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1, signDisplay: "exceptZero" });
const dateFmt = new Intl.DateTimeFormat("en-CA", { month: "short", day: "numeric", year: "numeric" });
const shortDate = new Intl.DateTimeFormat("en-CA", { month: "short", day: "numeric" });
const timeFmt = new Intl.DateTimeFormat("en-CA", { hour: "numeric", minute: "2-digit" });

const isNum = v => typeof v === "number" && isFinite(v);
const fmtMoney = v => isNum(v) ? money.format(v) : "–";
const fmtPct = v => isNum(v) ? pctFmt.format(v) : "–";
const signClass = v => !isNum(v) || Math.abs(v) < 1e-9 ? "" : (v > 0 ? "up" : "down");

function serialToDate(serial) {
  if (!isNum(serial) || serial <= 0) return null;
  const ms = Math.round((serial - 25569) * 86400000); // days since 1899-12-30 to Unix epoch
  const d = new Date(ms);
  return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours(), d.getUTCMinutes());
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "style") node.setAttribute("style", v);
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

/* ---------------- Rendering ---------------- */

function renderAlerts(f) {
  const box = document.getElementById("alerts");
  box.replaceChildren();
  if (f.stop_triggered === 1) {
    box.append(el("div", { class: "alert", role: "alert" },
      el("strong", {}, "The stop rule has been triggered."),
      "The account is down 30% or more from $20. By the rules, the experiment ends here and the money moves into XEQT."));
  }
  if (isNum(f.cash_diff) && Math.abs(f.cash_diff) >= 0.005) {
    box.append(el("div", { class: "alert" },
      el("strong", {}, `The sheet's cash is ${fmtMoney(Math.abs(f.cash_diff))} ${f.cash_diff > 0 ? "above" : "below"} what Wealthsimple shows.`),
      "Check the fill prices, share counts and fees in the Trades tab."));
  }
}

function renderHeader(f) {
  const start = serialToDate(f.start_date);
  const p = document.getElementById("started");
  if (start) {
    const days = Math.max(0, Math.floor((Date.now() - start.getTime()) / 86400000));
    p.textContent = `Started ${dateFmt.format(start)}, day ${days + 1}`;
  } else {
    p.textContent = "Not started yet";
  }
}

function lane(name, sub, value, change, kind, pending) {
  const scale = lane.scale;
  const frac = isNum(change) ? Math.min(Math.abs(change) / scale, 1) * 50 : 0;
  const loss = isNum(change) && change < 0;
  let barStyle;
  if (pending) barStyle = "left:50%;width:0";
  else barStyle = loss ? `right:50%;width:${frac}%` : `left:50%;width:${frac}%`;
  const label = pending
    ? `${name}: not started`
    : `${name}: ${fmtMoney(value)}, ${fmtPct(change)} since the start`;
  return el("div", { class: "lane" },
    el("div", { class: "lane-name" }, name, el("small", {}, sub)),
    el("div", { class: "track", role: "img", "aria-label": label },
      el("div", { class: ["bar", lane.animate ? "is-grow" : "", kind === "bench" ? "is-bench" : "", loss ? "is-loss" : "", pending ? "is-pending" : ""].join(" ").replace(/\s+/g, " ").trim(), style: barStyle })),
    el("div", { class: "lane-value" },
      el("b", {}, pending ? "–" : fmtMoney(value)),
      el("span", { class: pending ? "" : signClass(change) }, pending ? "Set the start price" : fmtPct(change)))
  );
}

function renderRace(f) {
  const startCash = isNum(f.start_cash) ? f.start_cash : 20;
  const claudeChange = isNum(f.account_value) ? f.account_value / startCash - 1 : null;
  const started = isNum(f.xeqt_start) && isNum(f.benchmark_value);
  const benchChange = started ? f.benchmark_value / startCash - 1 : null;

  lane.scale = Math.max(0.05, Math.abs(claudeChange || 0), Math.abs(benchChange || 0));
  // round the scale up to a whole percent so the axis labels are clean
  lane.scale = Math.ceil(lane.scale * 100) / 100;

  let verdictText, verdictClass = "";
  if (!started) {
    verdictText = "The race starts when the $20 lands in the account.";
  } else {
    const gap = f.ahead;
    if (Math.abs(gap) < 0.005) verdictText = "Claude and XEQT are dead even.";
    else if (gap > 0) { verdictText = `Claude is ${fmtMoney(gap)} ahead of the index.`; verdictClass = "is-ahead"; }
    else { verdictText = `Claude is ${fmtMoney(-gap)} behind the index.`; verdictClass = "is-behind"; }
  }

  const s = Math.round(lane.scale * 100);
  return el("section", { class: "race", "aria-labelledby": "race-title" },
    el("h2", { id: "race-title", class: "sr-only" }, "Claude against the benchmark"),
    el("p", { class: `verdict ${verdictClass}` }, verdictText),
    !started ? el("p", { class: "section-note" }, "On the start date, fill in the start date and XEQT's closing price on the Summary tab. Until then the benchmark has nothing to measure from.") : null,
    el("div", { class: "lanes" },
      lane("Claude's picks", `${fmtMoney(f.cash)} cash, ${fmtMoney(f.holdings_value)} in stocks`, f.account_value, claudeChange, "claude", false),
      lane("XEQT", "the same $20, bought and held", f.benchmark_value, benchChange, "bench", !started)
    ),
    el("div", { class: "scale", "aria-hidden": "true" },
      el("span"),
      el("div", { class: "scale-axis" }, el("span", {}, `−${s}%`), el("span", {}, `$${startCash} start`), el("span", {}, `+${s}%`)),
      el("span"))
  );
}

function renderOrders(trades) {
  const planned = trades.filter(t => t.Status === "Planned" && t.Ticker);
  const sec = el("section", { "aria-labelledby": "orders-title" },
    el("h2", { id: "orders-title" }, "Orders to place"));
  if (!planned.length) {
    sec.append(el("p", { class: "empty" }, "No orders waiting. Tonight's plan shows up here once it's in the Trades tab."));
    return sec;
  }
  const list = el("div", { class: "tickets" });
  planned.forEach(t => {
    const action = t.Action === "Sell" ? "Sell" : "Buy";
    const shares = isNum(t.Shares) ? t.Shares : "?";
    list.append(el("article", { class: "ticket" },
      t.Date instanceof Date ? el("p", { class: "ticket-date" }, `For ${dateFmt.format(t.Date)}, day order`) : null,
      el("h3", {}, `${action} ${shares} ${t.Ticker} at ${fmtMoney(t["Limit price"])} or better`),
      el("dl", {},
        isNum(t["Stop-loss"]) ? el("div", {}, el("dt", {}, "Stop-loss"), el("dd", {}, fmtMoney(t["Stop-loss"]))) : null,
        isNum(t.Target) ? el("div", {}, el("dt", {}, "Target"), el("dd", {}, fmtMoney(t.Target))) : null,
        t["Exit by"] instanceof Date ? el("div", {}, el("dt", {}, "Exit by"), el("dd", {}, shortDate.format(t["Exit by"]))) : null
      ),
      t.Reason ? el("p", {}, t.Reason) : null
    ));
  });
  sec.append(list);
  return sec;
}

function renderPositions(holdings, f) {
  const open = holdings.filter(h => h.Ticker && isNum(h["Shares held"]) && h["Shares held"] > 0);
  const sec = el("section", { "aria-labelledby": "pos-title" },
    el("h2", { id: "pos-title" }, "What the account holds"));
  const list = el("div", { class: "positions" });
  open.forEach(h => {
    const chg = h["Change vs avg buy"];
    list.append(el("div", { class: "position" },
      el("b", {}, `${h.Ticker}, ${h["Shares held"]} share${h["Shares held"] === 1 ? "" : "s"}`),
      el("span", { class: "pos-value" }, fmtMoney(h["Market value (CAD)"])),
      el("span", { class: "pos-meta" }, `Bought at ${fmtMoney(h["Avg buy price"])}, now ${fmtMoney(h["Last close (CAD)"])}`),
      el("span", { class: `pos-change ${signClass(chg)}` }, fmtPct(chg))
    ));
  });
  sec.append(list);
  sec.append(el("div", { class: "cash-line" }, el("span", {}, "Cash"), el("b", {}, fmtMoney(f.cash))));
  if (!open.length) sec.append(el("p", { class: "empty", style: "margin-top:0.75rem" }, "No stocks held right now. Everything is in cash."));
  return sec;
}

function rangeBar(w) {
  const lo = w["30-day low"], hi = w["30-day high"], px = w["Price (CAD)"], avg = w["30-day avg close"];
  if (![lo, hi, px].every(isNum) || hi <= lo) return el("div", { class: "rg" }, el("span", { class: "nm" }, "No range data"));
  const pos = v => Math.min(100, Math.max(0, (v - lo) / (hi - lo) * 100));
  return el("div", { class: "rg" },
    el("div", { class: "range", role: "img", "aria-label": `30-day range ${fmtMoney(lo)} to ${fmtMoney(hi)}, now ${fmtMoney(px)}${isNum(avg) ? `, 30-day average ${fmtMoney(avg)}` : ""}` },
      el("div", { class: "range-line" }),
      isNum(avg) ? el("div", { class: "range-avg", style: `left:${pos(avg)}%` }) : null,
      el("div", { class: "range-dot", style: `left:${pos(px)}%` })),
    el("div", { class: "range-labels", "aria-hidden": "true" }, el("span", {}, fmtMoney(lo)), el("span", {}, fmtMoney(hi)))
  );
}

function renderWatchlist(watch, holdings) {
  const held = new Set(holdings.filter(h => isNum(h["Shares held"]) && h["Shares held"] > 0).map(h => h.Ticker));
  const rows = watch.filter(w => w.Ticker);
  const sec = el("section", { "aria-labelledby": "watch-title" },
    el("h2", { id: "watch-title" }, "Watchlist"),
    el("p", { class: "section-note" }, "Where each stock sits in its range of closing prices over the last 30 days, and whether it's above or below its 90-day average."));
  if (!rows.length) { sec.append(el("p", { class: "empty" }, "The Watchlist tab is empty.")); return sec; }

  const table = el("div", { class: "watch", role: "table", "aria-label": "Watchlist" },
    el("div", { class: "watch-head", role: "row" },
      el("span", { role: "columnheader" }, "Ticker"),
      el("span", { role: "columnheader" }, "Company"),
      el("span", { role: "columnheader", class: "num" }, "Price"),
      el("span", { role: "columnheader", class: "num" }, "Today"),
      el("span", { role: "columnheader" }, "30-day range"),
      el("span", { role: "columnheader", class: "num" }, "vs 90-day avg")));
  rows.forEach(w => {
    const px = w["Price (CAD)"], d = w["Day change"], a90 = w["90-day avg close"];
    const vs90 = isNum(px) && isNum(a90) && a90 > 0 ? px / a90 - 1 : null;
    const cls = ["watch-row", held.has(w.Ticker) ? "is-held" : "", w.Note === "Benchmark" ? "is-bench" : ""].join(" ").trim();
    table.append(el("div", { class: cls, role: "row" },
      el("span", { class: "tk", role: "cell" }, w.Ticker),
      el("span", { class: "nm", role: "cell", title: w.Name || "" }, w.Note === "Benchmark" ? "The benchmark" : (w.Name || "No data")),
      el("span", { class: "num pr", role: "cell" }, fmtMoney(px)),
      el("span", { class: `num ch ${signClass(d)}`, role: "cell" }, fmtPct(d)),
      Object.assign(rangeBar(w), { role: "cell" }),
      el("span", { class: `num trend ${signClass(vs90)}`, role: "cell" }, isNum(vs90) ? `${fmtPct(vs90)}` : "–")
    ));
  });
  sec.append(table);
  sec.append(el("div", { class: "legend", "aria-hidden": "true" },
    el("span", { class: "lg-dot" }, "today's price"),
    el("span", { class: "lg-avg" }, "30-day average"),
    held.size ? el("span", { class: "lg-held" }, "held now") : null));
  return sec;
}

function renderLog(trades) {
  const done = trades.filter(t => t.Ticker && t.Status && t.Status !== "Planned");
  const sec = el("section", { "aria-labelledby": "log-title" },
    el("h2", { id: "log-title" }, "Trade log"));
  if (!done.length) {
    sec.append(el("p", { class: "empty" }, "No trades yet. Filled, unfilled and cancelled orders are listed here with Claude's reasoning."));
    return sec;
  }
  done.sort((a, b) => (b.Date instanceof Date ? b.Date : 0) - (a.Date instanceof Date ? a.Date : 0));
  const list = el("div", { class: "log" });
  done.forEach(t => {
    const filled = t.Status === "Filled";
    const price = filled ? t["Fill price"] : t["Limit price"];
    list.append(el("details", { class: "trade" },
      el("summary", {},
        el("span", { class: "tr-date" }, t.Date instanceof Date ? dateFmt.format(t.Date) : "–"),
        el("span", { class: "tr-what" }, el("b", {}, `${t.Action || ""} ${isNum(t.Shares) ? t.Shares : ""} ${t.Ticker}`), ` at ${fmtMoney(price)}`),
        el("span", { class: `status ${filled ? "is-filled" : ""}` }, t.Status),
        el("span", { class: `num tr-cash ${signClass(t["Cash flow"])}` }, filled ? fmtMoney(t["Cash flow"]) : "")),
      el("div", { class: "tr-body" },
        el("p", {}, `Limit ${fmtMoney(t["Limit price"])}, stop ${fmtMoney(t["Stop-loss"])}, target ${fmtMoney(t.Target)}${isNum(t.Fees) && t.Fees > 0 ? `, fees ${fmtMoney(t.Fees)}` : ""}.`),
        t.Reason ? el("p", {}, t.Reason) : null)
    ));
  });
  sec.append(list);
  return sec;
}

function renderContributions(contribs, f) {
  const rows = contribs.filter(c => isNum(c["Amount (CAD)"]));
  if (!rows.length) return null;
  return el("section", { "aria-labelledby": "contrib-title" },
    el("h2", { id: "contrib-title" }, "Monthly $20 into XEQT"),
    el("div", { class: "contrib" },
      el("div", {}, el("span", {}, "Put in"), el("b", {}, fmtMoney(f.contributed))),
      el("div", {}, el("span", {}, "Worth now"), el("b", {}, fmtMoney(f.contrib_value))),
      el("div", {}, el("span", {}, "Gain"), el("b", { class: signClass(f.contrib_gain) }, fmtMoney(f.contrib_gain)))));
}

let firstRender = true;
function render(data) {
  const f = data.feed;
  lane.animate = firstRender;
  firstRender = false;
  renderHeader(f);
  renderAlerts(f);
  const app = document.getElementById("app");
  app.replaceChildren(
    renderRace(f),
    el("div", { class: "split" }, renderOrders(data.trades), renderPositions(data.holdings, f)),
    renderWatchlist(data.watchlist, data.holdings),
    renderLog(data.trades),
    renderContributions(data.contributions, f) || ""
  );
  const xt = serialToDate(f.xeqt_time);
  document.getElementById("source").textContent =
    `Loaded from the Google Sheet at ${timeFmt.format(new Date())}${xt ? `, with prices as of ${shortDate.format(xt)}, ${timeFmt.format(xt)}` : ""}. Prices come from Google Finance and can be up to 20 minutes behind.`.replace("..", ".");
}

function renderError(err) {
  const box = document.getElementById("alerts");
  const notShared = err.message === "not-shared" || err instanceof TypeError;
  box.replaceChildren(el("div", { class: "alert", role: "alert" },
    el("strong", {}, notShared ? "This page can't read the Google Sheet." : "The numbers didn't load."),
    notShared
      ? "In Google Sheets, open Share, set General access to “Anyone with the link” as Viewer, then reload this page."
      : err.message));
  const app = document.getElementById("app");
  if (app.querySelector(".loading")) app.replaceChildren();
}

/* ---------------- Boot ---------------- */

const reloadBtn = document.getElementById("reload");
async function refresh() {
  reloadBtn.disabled = true;
  reloadBtn.textContent = "Reloading";
  try {
    const data = location.hash === "#demo" ? demoData() : await loadAll();
    render(data);
  } catch (err) {
    console.error(err);
    renderError(err);
  } finally {
    reloadBtn.disabled = false;
    reloadBtn.textContent = "Reload numbers";
  }
}
reloadBtn.addEventListener("click", refresh);
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MINUTES * 60 * 1000);
</script>
